services:
  postgres:
    image: postgres:16
    container_name: car-price-db

    environment:
      POSTGRES_DB: car_prices
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  api:
    build: .
    container_name: car-price-api

    ports:
      - "9696:9696"

    depends_on:
      - postgres

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

volumes:
  postgres_data: